<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maple Grove Public Library</title>

  <!--
  =====================================================================
  SECTION 1: SEMANTIC HTML — EXAMPLE PAGE

  A small website for a public library. It uses every tag from
  Section 1:

    <header>  <nav>  <main>  <section>  <article>  <aside>  <footer>
    <figure>  <figcaption>  <time>  <mark>  <strong>  <address>
    <details>  <summary>

  Type the code for each tag under its comment.
  The image for this page is in the images folder:
    images/reading-room.jpg
  =====================================================================
  -->

  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    img { max-width: 100%; }
  </style>
</head>
<body>

  <!-- <header>: introductory content for the whole page.
       Holds the site title, a tagline and the main menu.
       Not the same as <head>, which is never shown on the page. -->


    <!-- <nav>: the MAJOR navigation links of the site.
         Use it for the main menu, not for every group of links. -->



  <!-- <main>: the content unique to THIS page.
       Only one visible <main> per page, placed directly inside <body>.
       Never inside header, nav, section, article, aside or footer. -->


    <!-- <section>: a themed group of content with its own heading.
         It only makes sense as part of this page. -->


        <!-- <strong>: IMPORTANT text the reader must not miss. -->



      <!-- <article>: self-contained content that makes sense on its
           own. Each news story could be shared by itself.
           An article can have its own <header> and <footer>. -->


        <!-- The article's own header: its title and date -->


            <!-- <time>: a machine-readable date.
                 People read the text; computers read datetime. -->



        <!-- <figure>: a self-contained image with its caption.
             <figcaption>: the caption, first or last inside <figure>.
             The <img> still needs alt text. -->



        <!-- The article's own footer: who wrote it -->



        <!-- <mark>: text highlighted because it is RELEVANT,
             here the word the reader searched for.
             (For important text, use <strong> instead.) -->



    <!-- <aside>: related content that is NOT part of the main flow.
         If you removed it, the page would still make sense. -->



      <!-- <details>: a box the visitor can open and close (no JavaScript).
           <summary>: the always-visible label. It must come FIRST. -->



  <!-- <footer>: closing content for the whole page:
       contact details and copyright. -->


    <!-- <address>: contact details for the people responsible
         for this page. Not for any address that appears in the content. -->



</body>
</html>
